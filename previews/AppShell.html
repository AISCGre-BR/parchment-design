<!doctype html>

  <span class="sc-toolbar__spacer"></span>

  <div class="sc-box sc-box--active" style="left:41%;top:26px;width:15%;height:56px"><span class="sc-box__tag">na</span>

  <div class="sc-zoom"><button aria-label="Diminuir zoom">−</button><span>100%</span><button aria-label="Aumentar zoom">+</button></div>
</div>
    <div class="sc-strip" style="grid-template-columns:repeat(5,1fr)"><div class="sc-pig-lapis">Pu</div><div class="sc-pig-orpiment">er</div><div class="is-active">na</div><div class="is-empty sc-pig-minium">tus</div><div class="is-empty sc-pig-murex">est</div></div>

</div>
</div>
<button class="sc-btn sc-btn--elevated" style="position:fixed;right:12px;bottom:12px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Claro / Vigília</button>
