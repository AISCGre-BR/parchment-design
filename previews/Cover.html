<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<link rel="stylesheet" href="../css/parchment.css"><link rel="stylesheet" href="../css/components.css"><title>Cover</title>
<style>
  html, body { margin: 0; background: var(--parchment); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; }
  .cv svg { position: absolute; inset: 0; }
  .parch { fill: var(--parchment-deep); rx: var(--radius-lg); filter: drop-shadow(0 4px 10px rgba(58,46,30,.18)); }
  .surf { fill: var(--surface); }
  .rub { fill: var(--rubric); rx: var(--radius-lg); filter: drop-shadow(0 4px 10px rgba(58,46,30,.18)); }
  .lap { fill: var(--lapis); rx: var(--radius-md); }
  .ink { fill: var(--ink); rx: var(--radius-lg); }
  .ori { fill: var(--orpiment); rx: var(--radius-sm); }
  .hair { stroke: var(--rule); stroke-width: 1; fill: none; }
  .hair-ink { stroke: var(--ink-muted); stroke-width: 1; fill: none; }
  .txt { position: absolute; left: 48px; bottom: 44px; max-width: 420px; }
  .name { font: 600 72px/.95 var(--font-serif); color: var(--ink); margin: 0; }
  .tag { font: 400 14px/20px var(--font-sans); color: var(--ink-muted); margin: 12px 0 0; }
</style>
</head>
<body>
<div class="cv">
<svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
  <!--
    blocks: rubric 160x256 (bleeds off the top), parchment-deep 192x252, ink 72x120, lapis 40x40 (handle-like), orpiment 16x16; radius-none on all
    arrangement: a gradual opening read right-to-left: a tall rubric slab, a parchment column, an ink block like a rubricated initial's ground, small pigment squares
    pattern: editorial serif, "hairlines not boxes" -> four staff-like hairlines (rule, 1px) crossing the parchment and rubric slabs, a 4-line staff at space-4 pitch
    scales: widths are multiples of space-8 (32) and space-2 (8); staff pitch space-4 (16); corners radius-lg on large blocks, radius-md / radius-sm on the small squares
  -->
  <rect class="parch" x="560" y="24" width="192" height="252"/>
  <rect class="rub" x="768" y="-16" width="160" height="256"/>
  <rect class="ink" x="512" y="48" width="72" height="120"/>
  <rect class="lap" x="696" y="200" width="40" height="40"/>
  <rect class="ori" x="600" y="232" width="16" height="16"/>
  <line class="hair-ink" x1="480" y1="96" x2="960" y2="96"/>
  <line class="hair-ink" x1="480" y1="112" x2="960" y2="112"/>
  <line class="hair-ink" x1="480" y1="128" x2="960" y2="128"/>
  <line class="hair-ink" x1="480" y1="144" x2="960" y2="144"/>
</svg>
<div class="txt"><p class="name">Parchment Design</p><p class="tag">Função antes da forma, com a matéria dos manuscritos.</p></div>
</div>
<button class="sc-btn sc-btn--elevated" style="position:fixed;right:12px;bottom:12px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Claro / Vigília</button>
</body>
</html>
