<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&display=swap">
<link rel="stylesheet" href="../css/parchment.css"><link rel="stylesheet" href="../css/components.css"><title>Toast</title></head>
<body>
<div class="sc-col">
  <div class="sc-toast sc-toast--ok" role="status"><span class="sc-toast__mark">Salvo</span><span>puer-natus-est.mocquereau</span><button class="sc-toast__act">Mostrar</button></div>
  <div class="sc-toast sc-toast--warn" role="status"><span class="sc-toast__mark">Aviso</span><span>4 sílabas de Einsiedeln 121 ainda sem recorte. Elas sairão vazias na tabela.</span><button class="sc-toast__act">Ir</button></div>
  <div class="sc-toast sc-toast--error" role="alert"><span class="sc-toast__mark">Erro</span><span>Não foi possível gravar o DOCX: a pasta está protegida contra escrita. Escolha outra pasta.</span><button class="sc-toast__act">Tentar de novo</button></div>
</div>
<button class="sc-btn sc-btn--outline" style="position:fixed;right:12px;bottom:12px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Claro / Vigília</button>
</body>
</html>
