<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<link rel="stylesheet" href="../css/parchment.css"><link rel="stylesheet" href="../css/components.css"><title>Toast</title></head>
<body>
<div class="sc-col">
<div class="sc-toast sc-toast--ok" role="status"><span class="sc-toast__dot"></span><span>Salvo</span><button class="sc-toast__act">Mostrar na pasta</button></div>
<div class="sc-toast sc-toast--warn" role="status"><span class="sc-toast__dot"></span><span>4 sílabas de Einsiedeln 121 sairão vazias</span><button class="sc-toast__act">Ir</button></div>
<div class="sc-toast sc-toast--error" role="alert"><span class="sc-toast__dot"></span><span>Sem permissão para gravar nesta pasta</span><button class="sc-toast__act">Escolher outra</button></div>
</div>
<button class="sc-btn sc-btn--elevated" style="position:fixed;right:12px;bottom:12px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Claro / Vigília</button>
</body>
</html>
