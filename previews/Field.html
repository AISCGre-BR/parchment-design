<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap">
<link rel="stylesheet" href="../css/parchment.css"><link rel="stylesheet" href="../css/components.css"><title>Field</title></head>
<body>
<div class="sc-col" style="max-width:520px">
  <label class="sc-field"><span>Título</span><input class="sc-input" id="f1" value="Puer natus est"></label>
  <label class="sc-field"><span>Silabificação</span><select class="sc-select" id="f2"><option>Cantada</option><option>Litúrgica tipográfica</option><option>Manual</option></select></label>
  <label class="sc-field"><span>Texto</span><textarea class="sc-textarea" id="f3">Puer natus est nobis, et filius datus est nobis</textarea></label>
  <label class="sc-field sc-field--error"><span>Endereço IIIF</span><input class="sc-input" id="f4" value="https://exemplo.org/iiif/manifesto"><small>O manifesto não carregou. Confira o endereço ou cole a imagem com Ctrl+V.</small></label>
</div>
<button class="sc-btn sc-btn--elevated" style="position:fixed;right:12px;bottom:12px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Claro / Vigília</button>
</body>
</html>
