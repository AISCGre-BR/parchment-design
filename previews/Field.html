<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..900;1,8..60,300..900&display=swap">
<link rel="stylesheet" href="../css/parchment.css"><link rel="stylesheet" href="../css/components.css"><title>Field</title></head>
<body>
<div class="sc-col" style="max-width:520px">
  <label class="sc-field"><span>Título da peça</span><input class="sc-input" id="f1" value="Puer natus est"></label>
  <label class="sc-field"><span>Silabificação</span><select class="sc-select" id="f2"><option>Cantada (Clayton Dias)</option><option>Litúrgica tipográfica</option><option>Manual</option></select></label>
  <label class="sc-field"><span>Texto litúrgico</span><textarea class="sc-textarea" id="f3" placeholder="Cole aqui o texto do canto…">Puer natus est nobis, et filius datus est nobis</textarea></label>
  <label class="sc-field sc-field--error"><span>URL IIIF</span><input class="sc-input" id="f4" value="https://exemplo.org/iiif/manifesto"><small>Não foi possível carregar o manifesto. Verifique a URL ou cole a imagem com Ctrl+V.</small></label>
</div>
<button class="sc-btn sc-btn--outline" style="position:fixed;right:12px;bottom:12px" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">Claro / Vigília</button>
</body>
</html>
